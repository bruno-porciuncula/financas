<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Finanças dos Porciunculas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9C6FA">
<meta name="description" content="Contas, entradas e saldo do Bruno e da Giulia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<style>
/* Casca instalável: abre o app do Google Apps Script em tela cheia. */
:root { --bg: #F4F5F8; --ink: #0E1530; --muted: #66708F; --blue: #3D78EE; --lime: #E3F49B; --lime-ink: #18210A; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; color: var(--ink); }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.splash { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  background: linear-gradient(180deg, #A9C6FA 0%, #5A8BEE 45%, #F4F5F8 100%); transition: opacity .35s; padding: 24px; text-align: center; }
.splash.hide { opacity: 0; pointer-events: none; }
.splash img { width: 96px; height: 96px; border-radius: 26px; box-shadow: 0 12px 30px rgba(20,50,140,.3); }
.splash h1 { margin: 0; font-size: 22px; color: #fff; }
.splash p { margin: 0; color: rgba(255,255,255,.9); font-size: 14px; }
.card { position: fixed; z-index: 3; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 440px; margin: 0 auto;
  background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 12px 40px rgba(14,21,48,.2); display: flex; flex-direction: column; gap: 10px; }
.card[hidden] { display: none; }
.card b { font-size: 16px; }
.card p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.4; }
.row { display: flex; gap: 8px; }
.btn { flex: 1; text-align: center; padding: 13px 10px; border-radius: 99px; font-weight: 600; font-size: 15px; text-decoration: none; border: 0; cursor: pointer; font-family: inherit; }
.btn.lime { background: var(--lime); color: var(--lime-ink); }
.btn.ghost { background: #EEF2FA; color: var(--ink); }
</style>
</head>
<body>
<div class="splash" id="splash">
  <img src="icon-192.png" alt="">
  <h1>Finanças dos Porciunculas</h1>
  <p>Abrindo a planilha…</p>
</div>

<iframe id="app" title="Finanças dos Porciunculas" allow="clipboard-write"></iframe>

<div class="card" id="help" hidden>
  <b>Primeira vez neste celular?</b>
  <p>Se a tela ficar em branco, entre na sua conta Google e autorize o app uma vez. Depois volte aqui.</p>
  <div class="row">
    <a class="btn lime" id="login" target="_blank" rel="noopener">Entrar no Google</a>
    <button class="btn ghost" id="ok" type="button">Já está funcionando</button>
  </div>
</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbzazRbFWu2vOyRfDIaOm0bJOOfWPtVP9z99agiZrzNNgc8uAVew3xINOlnLRJI9229n/exec";
const frame = document.getElementById("app"), splash = document.getElementById("splash"), help = document.getElementById("help");
document.getElementById("login").href = APP_URL;
frame.addEventListener("load", () => setTimeout(() => splash.classList.add("hide"), 300));
frame.src = APP_URL;
let seen = false; try { seen = localStorage.getItem("fin-ok") === "1"; } catch (e) {}
if (!seen) setTimeout(() => { help.hidden = false; }, 4000);
document.getElementById("ok").onclick = () => { help.hidden = true; try { localStorage.setItem("fin-ok", "1"); } catch (e) {} };
document.getElementById("login").addEventListener("click", () => {
  const back = () => { if (document.visibilityState === "visible") { frame.src = APP_URL + "?t=" + Date.now(); document.removeEventListener("visibilitychange", back); } };
  document.addEventListener("visibilitychange", back);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
